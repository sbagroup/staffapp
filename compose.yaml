version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      - MONGO_URI=mongodb+srv://hrmanager:staffapp1@cluster0.bqvarvd.mongodb.net/staffapp
      - PORT=3000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend